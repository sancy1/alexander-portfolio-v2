networks:
  portfolio-network:
    driver: bridge

services:
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: portfolio-api-gateway
    ports:
      - "80:80"
    environment:
      - AUTH_SERVICE_HOST=portfolio-auth-service
      - NOTIFICATION_SERVICE_HOST=portfolio-notification-service
      - GATEWAY_SECRET=${GATEWAY_SECRET:-default-secret-change-me}
    depends_on:
      - auth-service
      - notification-service
    networks:
      - portfolio-network
    restart: unless-stopped

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: portfolio-auth-service
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - DATABASE_URL=${DATABASE_URL}
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - REDIS_CONNECTION=${REDIS_CONNECTION}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ISSUER=${JWT_ISSUER}
      - JWT_AUDIENCE=${JWT_AUDIENCE}
      - JWT_EXPIRY_MINUTES=${JWT_EXPIRY_MINUTES}
      - ADMIN_MASTER_KEY=${ADMIN_MASTER_KEY}
      - ADMIN_KEY_REQUIRE_FOR_REGISTRATION=${ADMIN_KEY_REQUIRE_FOR_REGISTRATION}
      - ADMIN_ALLOWED_KEYS=${ADMIN_ALLOWED_KEYS}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
    ports:
      - "8080:8080"
    networks:
      - portfolio-network
    restart: unless-stopped

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: portfolio-notification-service
    environment:
      - APP_ENV=production
      - SERVER_PORT=8080
      # Database Configuration
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-notification_db}
      - DB_SSLMODE=${DB_SSLMODE:-require}
      # Kafka Configuration
      - KAFKA_BROKERS=${KAFKA_BROKERS}
      - KAFKA_TOPIC=auth-events
      - KAFKA_CONSUMER_GROUP=notification-service-group
      - KAFKA_USERNAME=${KAFKA_USERNAME:-avnadmin}
      - KAFKA_PASSWORD=${KAFKA_PASSWORD}
      - KAFKA_SASL_MECHANISM=${KAFKA_SASL_MECHANISM:-plain}
      # Redis Configuration
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DB=${REDIS_DB:-0}
      # JWT Configuration
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ISSUER=${JWT_ISSUER:-auth-service}
      # Swagger Configuration
      - SWAGGER_ADMIN_USER=${SWAGGER_ADMIN_USER:-admin}
      - SWAGGER_ADMIN_PASSWORD=${SWAGGER_ADMIN_PASSWORD}
      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-info}
    ports:
      - "8081:8080"
    networks:
      - portfolio-network
    depends_on:
      - auth-service
    restart: unless-stopped

volumes:
  postgres_data:
  rabbitmq_data:
  kafka_data:
  redis_data: