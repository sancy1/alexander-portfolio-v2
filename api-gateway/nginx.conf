events {
    worker_connections 1024;
}

http {
    add_header Access-Control-Allow-Origin * always;
    add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS' always;
    add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
    add_header Access-Control-Expose-Headers 'Content-Length,Content-Range' always;

    server {
        listen 80;
        server_name _;
        
        client_max_body_size 10M;
        
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        
        # Enable DNS runtime resolution for dynamic cloud upstreams
        resolver 8.8.8.8 valid=30s;

        # Gateway baseline health check
        location /health {
            access_log off;
            return 200 '{"status":"healthy","service":"API Gateway"}';
            add_header Content-Type application/json;
        }

        # Auth Service Layer — /api/v1/ rules
        location /api/v1/ {
            # 🔥 FIX: Declare variable inside the location block to isolate boot-time parsing panics
            set $auth_backend "http://${AUTH_SERVICE_HOST}:8080";
            
            proxy_pass $auth_backend$request_uri;
            proxy_set_header Host "${AUTH_SERVICE_HOST}";
            proxy_set_header X-Gateway-Secret "${GATEWAY_SECRET}";
            proxy_set_header X-Real-IP "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header Authorization $http_authorization;
            
            proxy_ssl_server_name on;
            proxy_ssl_verify off;
            
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 90s;
        }

        # Notification Service Layer — Universal Proxy
        location /api/notifications/ {
            # Strip the /api/notifications prefix cleanly before forwarding
            rewrite ^/api/notifications/(.*)$ /$1 break;
            
            # 🔥 FIX: Declare variable inside the location block to isolate boot-time parsing panics
            set $notification_backend "https://${NOTIFICATION_SERVICE_HOST}";
            
            proxy_pass $notification_backend;
            
            proxy_set_header Host "${NOTIFICATION_SERVICE_HOST}";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Resolve the silent SSL handshake failures on Render
            proxy_ssl_server_name on;
            proxy_ssl_verify off;
            
            # WebSockets support for Go Kafka event broadcasts
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 90s;
        }

        # Catch-all fallback
        location / {
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin *;
                add_header Access-Control-Allow-Methods 'GET, POST, PUT, DELETE, OPTIONS';
                add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
                add_header Access-Control-Max-Age 1728000;
                add_header Content-Type 'text/plain; charset=utf-8';
                add_header Content-Length 0;
                return 204;
            }
            return 404 '{"error":"Route not found"}';
            add_header Content-Type application/json;
        }
    }
}