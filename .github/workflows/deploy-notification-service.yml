name: Deploy Notification Service

on:
  push:
    paths:
      - 'services/notification-service/**'
      - '.github/workflows/deploy-notification-service.yml'
    branches:
      - main
      - develop

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/notification-service

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      notif_changed: ${{ steps.changes.outputs.notification-service }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            notification-service:
              - 'services/notification-service/**'

  build-and-deploy:
    needs: detect-changes
    if: needs.detect-changes.outputs.notif_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22' # Use your specific Go version
          cache-dependency-path: services/notification-service/go.sum
      
      - name: Install dependencies
        run: |
          cd services/notification-service
          go mod download
      
      - name: Test Notification Service
        run: |
          cd services/notification-service
          go test -v ./...
      
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build Docker Image
        run: |
          cd services/notification-service
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} -f Dockerfile .
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
      
      - name: Push Docker Image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

